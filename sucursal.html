<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancolombia - Solicitud de Tarjeta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            background-color: #333;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo {
            height: 28px;
            object-fit: contain;
        }

        .header-center {
            flex: 1;
            text-align: center;
        }

        .header-title {
            font-weight: 700;
            font-size: 18px;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 100%;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
        }

        .header-bar {
            background: linear-gradient(90deg, #FFD700 0%, #FFD700 100%);
            height: 4px;
        }

        .content {
            padding: 40px 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 12px;
            padding-left: 40px;
            border: none;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
            color: #333;
            font-family: inherit;
            background-color: transparent;
            transition: border-color 0.2s;
            background-repeat: no-repeat;
            background-position: left center;
            background-size: 24px;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-bottom-color: #333;
        }

        .form-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 20px;
            padding-right: 30px;
            padding-left: 40px;
        }

        .select-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            fill: #999;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            fill: #999;
            pointer-events: none;
        }

        .info-box {
            background-color: #f0f0f0;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: flex;
            gap: 10px;
            font-size: 13px;
            color: #2196F3;
        }

        .info-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
            accent-color: #FFD700;
        }

        .checkbox-label {
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .checkbox-label a {
            color: #0066cc;
            text-decoration: none;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        .button-group {
            margin-top: 40px;
        }

        .btn-siguiente {
            width: 100%;
            padding: 14px;
            background-color: #ccc;
            color: #666;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-siguiente.active {
            background-color: #FFD700;
            color: #000;
        }

        .btn-siguiente:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        /* FOOTER */
        .footer {
            background-color: #333;
            color: white;
            padding: 30px 20px;
            text-align: center;
            font-size: 11px;
            line-height: 1.8;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            text-align: left;
        }

        .footer-right {
            text-align: right;
        }

        /* RESPONSIVE */
        @media (min-width: 1024px) {
            .content {
                padding: 60px 80px;
                max-width: 600px;
                margin: 0 auto;
            }

            .title {
                font-size: 36px;
                margin-bottom: 40px;
                text-align: center;
            }

            .form-group {
                margin-bottom: 30px;
            }

            .info-box {
                margin-bottom: 25px;
            }

            .checkbox-group {
                padding: 20px;
            }

            .button-group {
                margin-top: 50px;
            }

            .btn-siguiente {
                padding: 16px;
                font-size: 16px;
            }

            .footer-content {
                flex-direction: row;
            }
        }

        @media (max-width: 1023px) {
            .header {
                padding: 12px 16px;
            }

            .header-left {
                gap: 8px;
            }

            .back-button {
                font-size: 14px;
                padding: 4px 8px;
            }

            .logo {
                height: 24px;
            }

            .content {
                padding: 30px 16px;
            }

            .title {
                font-size: 24px;
                margin-bottom: 25px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .info-box {
                font-size: 12px;
                padding: 10px;
            }

            .checkbox-group {
                padding: 12px;
                gap: 10px;
            }

            .checkbox-label {
                font-size: 12px;
            }

            .btn-siguiente {
                padding: 12px;
                font-size: 14px;
            }

            .footer-content {
                flex-direction: column;
                gap: 15px;
            }

            .footer-right {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="back-button">< Volver</a>
        </div>
        <div class="header-center">
            <img src="bancol.png" alt="Bancolombia" class="logo">
        </div>
        <div style="width: 60px;"></div>
    </div>

    <!-- HEADER BAR -->
    <div class="header-bar"></div>

    <!-- MAIN CONTENT -->
    <div class="container">
        <div class="content">
            <h1 class="title">¡Todo listo! Empecemos con tu número de documento</h1>

            <div class="form-group">
                <label class="form-label">Tipo de documento de identidad</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="20" height="16" rx="1" stroke="#999" stroke-width="2" fill="none"/>
                        <line x1="2" y1="9" x2="22" y2="9" stroke="#999" stroke-width="1"/>
                        <rect x="4" y="11" width="3" height="2" fill="#999"/>
                    </svg>
                    <select class="form-select" id="tipoDocumento">
                        <option>Cédula de Ciudadanía</option>
                        <option>Pasaporte</option>
                        <option>Tarjeta de Identidad</option>
                        <option>Cédula de Extranjería</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Número de documento</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="20" height="16" rx="1" stroke="#999" stroke-width="2" fill="none"/>
                        <line x1="2" y1="9" x2="22" y2="9" stroke="#999" stroke-width="1"/>
                        <rect x="4" y="11" width="3" height="2" fill="#999"/>
                    </svg>
                    <input type="text" class="form-input" id="numeroDocumento" placeholder="Ingresa tu número de documento">
                </div>
            </div>

            <div class="info-box">
                <span class="info-icon">ℹ</span>
                <span>Si tienes otro tipo de documento, acércate a la oficina más cercana para solicitar tu producto.</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="autorizo" class="checkbox-input">
                <label for="autorizo" class="checkbox-label">
                    Autorizo a Bancolombia para que el número de celular y el correo electrónico, sean tratados para contactarme y/o enviarme la información relacionada con la solicitud del producto. Igualmente para que me consulten ante Operadores de Información y Riesgo con el fin de verificar mi información personal. <a href="#">Términos, Condiciones y Políticas de Privacidad para la solicitud de productos.</a>
                </label>
            </div>

            <div class="button-group">
                <button class="btn-siguiente" id="siguienteBtn">Siguiente</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <p>© 2026 Bancolombia S.A.</p>
            </div>
            <div class="footer-right">
                <p>Dirección IP 186.168.255.35</p>
                <p>lunes 27 de julio de 2026. 10:53:09 p. m.</p>
            </div>
        </div>
    </div>

    <script>
        const checkboxInput = document.getElementById('autorizo');
        const siguienteBtn = document.getElementById('siguienteBtn');
        const documentoInput = document.getElementById('numeroDocumento');
        const tipoDocumento = document.getElementById('tipoDocumento');

        function updateButtonState() {
            if (checkboxInput.checked && documentoInput.value.trim()) {
                siguienteBtn.classList.add('active');
                siguienteBtn.disabled = false;
            } else {
                siguienteBtn.classList.remove('active');
                siguienteBtn.disabled = true;
            }
        }

        checkboxInput.addEventListener('change', updateButtonState);
        documentoInput.addEventListener('input', updateButtonState);

        // Validar que solo se ingresen números
        documentoInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        siguienteBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (checkboxInput.checked && documentoInput.value.trim()) {
                // Guardar datos en localStorage para usarlos en formulario.html
                localStorage.setItem('tipoDocumento', tipoDocumento.value);
                localStorage.setItem('numeroDocumento', documentoInput.value.trim());
                
                // Redirigir a formulario.html
                window.location.href = 'formulario.html';
            }
        });
    </script>
</body>
</html>
